# Explicit-voter patterns — NOT part of the default catalogue.
#
# data/patterns.yaml is loaded by every instance in tools/build_all.sh. Rerouting
# an owner's output through a voter needs the owner's outgoing channels
# re-guarded, and when one of those channels is an input_fanout copy belonging
# to a DOWNSTREAM actor's pattern, the edge needs the source's and the
# destination's pattern guards at once. lib/activation.mzn carries this as a
# second, conjunctive guard (pe_owner2, pe_guard2), so the record builds with
# every instance. It stays out of the main catalogue because adding it would
# change the optimum of existing instances (docs/design.md#voters).
#
# Use it explicitly:
#
#   build_dzn.py ... --patterns data/patterns_explicit_voter.yaml
#
# data/patterns_explicit_voter_demo.yaml (none, low_sil_diverse_doer_checker,
# nvp_three_version) builds out/v_nvp.dzn.

  # Armoush, "Design Patterns for Safety-Critical Embedded Systems" (2010),
  # N-Version Programming. N independently developed versions run from the same
  # specification and a voter decides the output by majority. Unlike every
  # pattern above it, the OWNER IS NOT THE OUTPUT PRODUCER: the voter is, so
  # the owner's outgoing channels are rerouted through it (tools/patterns.py,
  # "output rerouting for explicit voters").
  #
  # N=3 here. Two versions plus the owner give three channels to vote on, which
  # is the minimum for majority voting -- with two the voter can detect a
  # disagreement but not say which side is right, and that is a 2-of-2, which
  # is already in this catalogue as two_of_two_high_sil.
  #
  # The voter is a single point of failure and Armoush says so. It is why the
  # placement puts it in its own FCR and why a real deployment wants it small
  # and formally verified; the argument records that as an undeveloped goal
  # rather than pretending the pattern removes the problem.
patterns:
  - id: none
    source: [baseline]
    description: >
      No structural pattern.  The required integrity is met by development
      process alone.  IEC 61508 treats this as adequate at the lower integrity
      levels only.  The ceiling is SIL 1, per IEC 61508: from SIL 2 upward the
      standard expects diagnostic coverage, so a SIL-2 actor must take at least
      a checker pattern and cannot be discharged by process alone.
      This ceiling is the single most consequential number in the library --
      move it and the whole design space moves with it -- which is exactly why
      it lives in the data where it can be argued with, not in the solver.
    components: []
    edges: []
    placement: []
    achieves_sil: [0, 1]
    covers_faults: [random_hw, systematic_sw]
    failure_mode: none
    voter: folded
    recurring_cost_units: 0
    scenarios: []
    tactics: []
    sdf_compatible: true

  # -------------------------------------------------------------------------
  - id: nvp_three_version
    description: >
      N-version programming with three independently developed versions and an
      explicit majority voter. The versions compute from the same inputs and
      the voter selects the majority result, masking a fault in any one
      version.
    source: [Armoush 2010, IEC 61508-7 C.4.4]
    components:
      - {role: version_2, sil_offset: 0, wcet_type: "<owner>"}
      - {role: version_3, sil_offset: 0, wcet_type: "<owner>"}
      - {role: voter, sil_offset: 0, wcet_type: "voter_<owner>"}
    edges:
      - {from: owner, to: voter, tokens: 0}
      - {from: version_2, to: voter, tokens: 0}
      - {from: version_3, to: voter, tokens: 0}
    input_fanout: [version_2, version_3]
    output_from: voter
    voter: explicit
    placement:
      - {relation: DIFFERENT_FCR, members: [owner, version_2, version_3],
         for: random_hw}
      - {relation: DIVERSE, members: [owner, version_2, version_3],
         for: systematic_sw}
      - {relation: DIFFERENT_FCR, members: [owner, voter], for: random_hw}
    achieves_sil: [3, 4]
    covers_faults: [random_hw, systematic_sw]
    failure_mode: masking
    dev_cost_multiplier: {version: 1.0, voter: 0.4}
    recurring_cost_units: 4
    scenarios:
      - id: SC1
        text: >
          A fault in any single version is masked by the majority of the
          remaining versions.
        tactics: [Voting]
      - id: SC2
        text: >
          A random hardware fault affects at most one of the three versions.
        covers: random_hw
        tactics: [Replication Redundancy]
      - id: SC3
        text: >
          A systematic fault in one version is not reproduced by the other
          two versions.
        covers: systematic_sw
        tactics: [Diverse Redundancy]
      - id: SC4
        text: >
          A disagreement among the versions is detected before the result
          leaves the component.
        tactics: [Comparison]
    tactics: [Replication Redundancy, Diverse Redundancy, Comparison, Voting]
    sdf_compatible: true
